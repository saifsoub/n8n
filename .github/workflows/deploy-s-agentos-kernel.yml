name: Deploy s-agentos-kernel

on:
  push:
    branches:
      - claude/inspect-and-deploy-akbdM
      - main
    paths:
      - 's-agentos-kernel/cloudflare/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no file changes'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers

    steps:
      - uses: actions/checkout@v4

      - name: Set secrets via wrangler
        working-directory: s-agentos-kernel/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          S_AGENTOS_OPERATOR_KEY: ${{ secrets.S_AGENTOS_OPERATOR_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm install -g wrangler
          echo "$S_AGENTOS_OPERATOR_KEY" | wrangler secret put S_AGENTOS_OPERATOR_KEY --name s-agentos-kernel
          echo "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --name s-agentos-kernel
          echo "$SUPABASE_SERVICE_ROLE_KEY" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name s-agentos-kernel

      - name: Deploy worker
        working-directory: s-agentos-kernel/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Extract subdomain from account ID (first 8 chars)
          WORKER_URL="https://s-agentos-kernel.${{ secrets.CF_ACCOUNT_ID }}.workers.dev"
          echo "Testing $WORKER_URL/healthz"
          curl -sf "$WORKER_URL/healthz" | grep '"ok":true' && echo 'Health check passed' || echo 'Health check failed (non-fatal)'
